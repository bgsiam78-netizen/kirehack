<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BG SIAM VIP HACK</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');
        
        * { box-sizing: border-box; user-select: none; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Orbitron', sans-serif; background: #05070f; }
        #game-frame { border: none; width: 100%; height: 100%; position: absolute; z-index: 1; }

        @keyframes rgbGlow {
            0% { border-color: #ff0055; box-shadow: 0 0 10px #ff0055; }
            33% { border-color: #00f2ff; box-shadow: 0 0 10px #00f2ff; }
            66% { border-color: #7000ff; box-shadow: 0 0 10px #7000ff; }
            100% { border-color: #ff0055; box-shadow: 0 0 10px #ff0055; }
        }

        /* ফ্লোটিং বাটন - এক টাচে শো/হাইড */
        #floating-btn {
            position: fixed; left: 15px; top: 35%; width: 45px; height: 45px;
            background: rgba(10, 14, 26, 0.9); border: 2px solid #00f2ff; border-radius: 50%;
            color: #00f2ff; display: flex; justify-content: center; align-items: center;
            font-size: 11px; font-weight: 900; z-index: 999999;
            animation: rgbGlow 4s linear infinite; cursor: pointer; backdrop-filter: blur(5px);
        }

        /* আরও ছোট এবং কম্প্যাক্ট হ্যাক প্যানেল */
        #hack-panel {
            display: none; position: fixed; top: 15px; right: 15px; 
            width: 180px; background: rgba(10, 14, 26, 0.9); 
            backdrop-filter: blur(12px); border: 2px solid #00f2ff; border-radius: 12px;
            z-index: 999999; text-align: center; color: white;
            animation: rgbGlow 5s linear infinite; padding-bottom: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }

        .header-top { background: rgba(255, 255, 255, 0.05); padding: 6px; border-radius: 10px 10px 0 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .header-top h2 { margin: 0; font-size: 11px; letter-spacing: 1px; color: #fff; background: linear-gradient(45deg, #00f2ff, #ff0055); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .brand-logo { width: 50px; height: 50px; border-radius: 50%; border: 2px dashed #00f2ff; margin: 8px auto; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(0,242,255,0.15) 0%, rgba(0,0,0,0.4) 100%); color: #fff; font-size: 10px; font-weight: 900; text-shadow: 0 0 5px #00f2ff; }
        .line-glow { height: 1px; background: linear-gradient(90deg, transparent, #00f2ff, transparent); width: 80%; margin: 0 auto 8px; }

        input[type="password"] { width: 85%; padding: 7px; margin-bottom: 8px; background: rgba(0, 0, 0, 0.6); border: 1px solid #00f2ff; border-radius: 6px; color: #00f2ff; text-align: center; font-size: 13px; outline: none; letter-spacing: 2px; font-family: 'Orbitron', sans-serif; }
        .action-btn { width: 85%; padding: 7px; background: linear-gradient(135deg, #ff0055, #7000ff); border: none; border-radius: 6px; font-weight: 900; color: #fff; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 11px; }

        #r-area { display: none; }
        
        .prediction-flex { display: flex; justify-content: center; padding: 5px; }
        .res-box { width: 110px; padding: 8px; border: 2px solid #00f2ff; border-radius: 8px; color: #00f2ff; font-size: 16px; font-weight: 900; background: rgba(0, 242, 255, 0.08); letter-spacing: 1px; }

        .timer-info { font-size: 10px; color: #aaa; margin-top: 6px; }
        .cyan-text { color: #00f2ff; font-weight: 900; font-size: 11px; }
        .min-btn { color: #ff0055; font-size: 9px; cursor: pointer; display: inline-block; margin-top: 8px; font-weight: 700; }
    </style>
</head>
<body>

<iframe src="https://dkwin9.com/#/register?invitationCode=153412260157" id="game-frame"></iframe>

<div id="floating-btn" onclick="toggle()">SIAM</div>

<div id="hack-panel">
    <div class="header-top"><h2>BG SIAM VIP</h2></div>
    <div class="brand-logo">BG SIAM</div>
    <div class="line-glow"></div>

    <div id="l-box">
        <input type="password" id="pass" placeholder="PASS">
        <button class="action-btn" onclick="login()">LOGIN</button>
    </div>

    <div id="r-area">
        <div style="font-size: 10px; color: #00f2ff;" id="p-id">PERIOD: ---</div>
        <div class="prediction-flex">
            <div id="p-val" class="res-box">WAIT</div>
        </div>
        <div class="timer-info">TIME: <span class="cyan-text" id="time">--</span>S</div>
        <span class="min-btn" onclick="toggle()">[ CLOSE ]</span>
    </div>
</div>

<script>
    const panel = document.getElementById('hack-panel');

    function toggle() { 
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block'; 
    }

    function login() {
        const inputPass = document.getElementById('pass').value.trim();
        if(inputPass.toUpperCase() === "BV") {
            document.getElementById('l-box').style.display = 'none';
            document.getElementById('r-area').style.display = 'block';
            setInterval(update, 1000);
            update();
        } else { 
            alert("WRONG PASSWORD!"); 
        }
    }

    function update() {
        const now = new Date();
        const s = now.getUTCSeconds();
        const currentP = Math.floor(((now.getUTCHours() * 3600) + (now.getUTCMinutes() * 60) + s) / 30) + 1;
        
        document.getElementById('p-id').innerText = "PERIOD: " + (currentP % 1000).toString().padStart(3, '0');
        const timeLeft = 30 - (s % 30);
        document.getElementById('time').innerText = timeLeft.toString().padStart(2, '0');

        const resDiv = document.getElementById('p-val');
        if (timeLeft > 25) {
            resDiv.innerText = "WAIT"; 
            resDiv.style.color = "#888";
            resDiv.style.borderColor = "#555";
        } else {
            const math = (currentP * 73) + (now.getUTCMinutes() * 31);
            const res = (math % 2 === 0) ? "BIG" : "SMALL";
            resDiv.innerText = res;
            if (res === "BIG") {
                resDiv.style.color = "#00f2ff";
                resDiv.style.borderColor = "#00f2ff";
            } else {
                resDiv.style.color = "#ff0055";
                resDiv.style.borderColor = "#ff0055";
            }
        }
    }
</script>
</body>
</html>
